name: Quality

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Types, formatting, and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up pinned npm
        run: npm install --global npm@12.1.0 --ignore-scripts

      - name: Install dependencies
        run: npm run install:profile -- main

      - name: Audit dependencies
        run: npm audit signatures && npm audit --audit-level=high

      - name: Check types, formatting, and builds
        run: npm run typecheck && npm run lint && npm run build && npm run build:demo

  tests:
    name: Tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up pinned npm
        run: npm install --global npm@12.1.0 --ignore-scripts

      - name: Install dependencies
        run: npm run install:profile -- main

      - name: Allow the test container to create Chromium's sandbox
        run: |
          sudo tee /etc/apparmor.d/feedfold-ci <<'EOF_PROFILE'
          abi <abi/4.0>,
          profile feedfold-ci flags=(unconfined) {
            userns,
          }
          EOF_PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/feedfold-ci

      - name: Run tests with coverage in prepared browser environment
        # Keep this image aligned with the pinned Playwright package. Use the host's
        # pinned Node runtime and preserve the browser sandbox with a non-root user.
        run: |
          docker run --rm --init --ipc=host \
            --user "$(id -u):$(id -g)" \
            --security-opt apparmor=feedfold-ci \
            --security-opt "seccomp=$GITHUB_WORKSPACE/.docker/playwright-seccomp.json" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$(dirname "$(dirname "$(command -v node)")"):/opt/node:ro" \
            --workdir "$GITHUB_WORKSPACE" \
            --env HOME=/tmp --env CI=true --env FEEDFOLD_COVERAGE_SHARD=true \
            --env PATH=/opt/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07 \
            npm run test:coverage -- --shard=${{ matrix.shard }}/3 --maxWorkers=1 --reporter=default --reporter=blob --outputFile.blob=coverage/shard-${{ matrix.shard }}.json

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.shard }}
          path: coverage/shard-${{ matrix.shard }}.json
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Desktop development and unsigned packaging
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            environments/desktop/package-lock.json
            environments/packaging/package-lock.json
      - name: Set up pinned npm
        run: npm install --global npm@12.1.0 --ignore-scripts
      - name: Build and test desktop development installation
        run: |
          npm run install:profile -- desktop
          npm audit signatures --prefix environments/desktop
          npm audit --audit-level=high --prefix environments/desktop
          npm run typecheck:desktop
          npm run build:desktop
          node scripts/smoke-packaged-desktop.mjs --development
      - name: Create unsigned package from built source
        run: |
          npm run install:profile -- packaging
          npm audit signatures --prefix environments/packaging
          npm audit --audit-level=high --prefix environments/packaging
          npm run desktop:package
          npm run desktop:smoke:packaged
          cd release
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS
      - name: Upload tested unsigned desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-desktop
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  image:
    name: Build production image
    outputs:
      checksum: ${{ steps.identity.outputs.checksum }}
      image-id: ${{ steps.identity.outputs.image-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: feedfold:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=feedfold
          cache-to: type=gha,scope=feedfold,mode=max

      - name: Verify image startup and browser
        run: |
          trap 'docker rm --force feedfold-smoke' EXIT
          docker run --detach --name feedfold-smoke --publish 127.0.0.1:3000:3000 "feedfold:$GITHUB_SHA"
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/health
          docker exec feedfold-smoke node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch(); const page = await browser.newPage(); await page.goto("http://127.0.0.1:3000/"); if (await page.title() !== "feedfold") throw new Error("The reader did not load"); await browser.close();'

      - name: Audit installed image dependencies
        run: docker run --rm --user root --entrypoint sh "feedfold:$GITHUB_SHA" -c 'node scripts/verify-dependencies.mjs server --omit-dev && npm audit signatures && npm audit --omit=dev --audit-level=high'

      - name: Export production image and record identity
        id: identity
        run: |
          docker save "feedfold:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/feedfold-image.tar.gz"
          echo "checksum=$(sha256sum "$RUNNER_TEMP/feedfold-image.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "image-id=$(docker image inspect --format '{{.Id}}' "feedfold:$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Upload production image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-image
          path: ${{ runner.temp }}/feedfold-image.tar.gz
          compression-level: 0
          retention-days: 1

  coverage:
    name: Merge coverage
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up pinned npm
        run: npm install --global npm@12.1.0 --ignore-scripts

      - name: Install dependencies
        run: npm run install:profile -- main

      - name: Download test results and coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true

      - name: Merge coverage and enforce thresholds
        run: npm run test:coverage -- --merge-reports=test-results

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  quality:
    name: Quality
    needs: [checks, tests, coverage, image, desktop]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: test "$CHECKS_RESULT" = success && test "$TESTS_RESULT" = success && test "$COVERAGE_RESULT" = success && test "$IMAGE_RESULT" = success && test "$DESKTOP_RESULT" = success

  deploy:
    name: Deploy to DigitalOcean
    needs: [checks, tests, coverage, image]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://feedfold.com/
    steps:
      - name: Download verified production image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-image
          path: ${{ runner.temp }}

      - name: Verify artifact bytes and tested image identity
        env:
          EXPECTED_CHECKSUM: ${{ needs.image.outputs.checksum }}
          EXPECTED_IMAGE_ID: ${{ needs.image.outputs.image-id }}
        run: |
          echo "$EXPECTED_CHECKSUM  $RUNNER_TEMP/feedfold-image.tar.gz" | sha256sum --check --strict
          gzip -dc "$RUNNER_TEMP/feedfold-image.tar.gz" | docker load
          test "$(docker image inspect --format '{{.Id}}' "feedfold:$GITHUB_SHA")" = "$EXPECTED_IMAGE_ID"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "feedfold:$GITHUB_SHA")" = "$GITHUB_SHA"

      - name: Install deployment SSH credentials
        env:
          DEPLOY_KEY: ${{ secrets.FEEDFOLD_DEPLOY_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.FEEDFOLD_DEPLOY_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/feedfold
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/feedfold ~/.ssh/known_hosts

      - name: Deploy verified image
        env:
          DEPLOY_HOST: ${{ vars.FEEDFOLD_DEPLOY_HOST }}
        run: ssh -T -i ~/.ssh/feedfold -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST" "$GITHUB_SHA" < "$RUNNER_TEMP/feedfold-image.tar.gz"

      - name: Verify public service
        env:
          DEPLOY_HOST: ${{ vars.FEEDFOLD_DEPLOY_HOST }}
        # Cloudflare challenges GitHub-hosted runners; verify public URLs from the server.
        run: ssh -T -i ~/.ssh/feedfold -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST" "verify $GITHUB_SHA"

      - name: Remove deployment SSH credentials
        if: always()
        run: rm -f ~/.ssh/feedfold
