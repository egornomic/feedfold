name: Quality
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Diagnose public verification
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect public responses
        run: |
          getent ahosts feedfold.com
          for path in /health /api/auth/config; do
            echo "Checking $path"
            curl --silent --show-error --max-time 20 --dump-header response-headers --output response-body --write-out 'HTTP %{http_code}\n' "https://feedfold.com$path"
            cat response-headers
            head -c 800 response-body
            echo
          done
